  <rect x="116" y="176" width="280" height="64" rx="14" fill="#a2a9ab" stroke="#1c1e20" stroke-width="6" />
  <rect x="236" y="176" width="40" height="210" fill="#ab5330" stroke="#1c1e20" stroke-width="6" />
  <path d="M256 176 C 200 176, 176 120, 216 112 C 244 108, 256 150, 256 176 C 256 150, 268 108, 296 112 C 336 120, 312 176, 256 176 Z" fill="#ab5330" stroke="#1c1e20" stroke-width="6" />
